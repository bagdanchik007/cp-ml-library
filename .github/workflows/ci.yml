name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            os: ubuntu-latest
            cxx: g++
          - name: Clang
            os: ubuntu-latest
            cxx: clang++
          - name: MSVC
            os: windows-latest
            cxx: cl
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.name == 'GCC' && 'g++' || 'clang' }}
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
